import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'com.sunmi.plugin'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def serverUrlValue = localProperties.getProperty("SERVER_URL", "https://bhsglobal.hashmicro.co")
def escapedServerUrl = serverUrlValue.replace("\\", "\\\\").replace('"', '\\"')
def databaseValue = localProperties.getProperty("DATABASE", "bhs-live")
def escapedDatabase = databaseValue.replace("\\", "\\\\").replace('"', '\\"')

android {
    compileSdkVersion 29

    defaultConfig {
        applicationId "com.sunmi.uhf"
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 18
        versionName "1.0.25"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SERVER_URL", "\"${escapedServerUrl}\""
        buildConfigField "String", "DEFAULT_DATABASE", "\"${escapedDatabase}\""
    }
    signingConfigs {
        config {//签名
            keyAlias 'android'
            keyPassword 'android'
            storeFile file('../key/uhf.keystore')
            storePassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                if (buildType.name != 'debug' && System.getenv("BUILD_NUMBER") != null) {
                    //variant.getPackageApplication().outputDirectory = new File(project.buildDir.absolutePath + "/outputs" + "/apk")
                    variant.getPackageApplication().outputDirectory = new File("build/outputs/apk/" + variant.versionName + "/" + variant.flavorName + "/" + System.getenv("BUILD_NUMBER"))
                }
                outputFileName = "Sunmi_V" + defaultConfig.versionName + "_" + buildType.name + ".apk"
            }
    }
    lintOptions {
        abortOnError false
        disable 'GoogleAppIndexingWarning'
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.3.6'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.8'

    /**
     * 网络库
     */
    implementation 'com.sunmi:SunmiHttpLib:1.0.43'
    /**
     * lifecycle
     */
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    /**
     * recyclerview
     */
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    /**
     * cardview
     */
    implementation 'androidx.cardview:cardview:1.0.0'

    /**
     * 分页库
     */
    implementation "androidx.paging:paging-runtime-ktx:2.1.2"
    /**
     * 组件库
     */
    api('com.sunmi:SunmiWidgetLib:1.1.4') {
        exclude group: 'com.android.support'
    }

    /**
     * adapter
     */
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.2'

    //TabLayout等组件
    implementation 'com.google.android.material:material:1.2.1'
    // UHF-Java
    //implementation 'com.sunmi:rfidlibrary:1.1.2'
    // Excel
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    
    // XML-RPC for Odoo
    implementation('org.apache.xmlrpc:xmlrpc-client:3.1.3') {
        exclude group: 'junit', module: 'junit'
        exclude group: 'xml-apis', module: 'xml-apis'
    }
}